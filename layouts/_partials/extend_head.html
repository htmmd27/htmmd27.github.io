{{ if .Param "math" }}
<link rel="stylesheet" href="{{ "vendor/katex/katex.min.css" | relURL }}">
<script defer src="{{ "vendor/katex/katex.min.js" | relURL }}"></script>
<script defer src="{{ "vendor/katex/auto-render.min.js" | relURL }}"></script>
<script defer src="{{ "js/math.js" | relURL }}?v={{ substr (sha256 (readFile "static/js/math.js")) 0 12 }}"></script>
{{ end }}
{{- $tracked := or .IsHome (and .IsPage (or (in (slice "posts" "projects") .Section) (eq .Layout "pbr"))) -}}
{{- if and $tracked hugo.IsProduction (not hugo.IsServer) -}}
  {{- with site.Params.cloudflareWebAnalyticsToken }}
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon="{{ dict "token" . "spa" false | jsonify }}"></script>
  {{- end -}}
{{- end -}}
